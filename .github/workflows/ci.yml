name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/cc-pacekeeper
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bun run typecheck

  # The Codex package installs and runs on its own, with no dependency on a
  # sibling checkout, so a packaged install is exercised the way a user gets it.
  codex:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/codex-pacekeeper
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bun run typecheck
      - name: verify opt-in package wiring in a disposable profile
        run: |
          test -x bin/pacekeeper-tick
          test -x bin/pacekeeper-refresh
          test -x bin/pacekeeper-checkpoint
          test -x bin/pacekeeper-worktrees
          test -x bin/pacekeeper-service
          test -x bin/pacekeeper-doctor
          test -x bin/pacekeeper-presence
          bun -e 'const p=JSON.parse(await Bun.file(".codex-plugin/plugin.json").text()); if (p.name !== "codex-pacekeeper" || p.version !== JSON.parse(await Bun.file("package.json").text()).version || p.optIn !== true) process.exit(1); JSON.parse(await Bun.file("hooks/hooks.json").text())'
      - name: hook entrypoints answer with valid hook JSON and never launch a service in CI
        env:
          CODEX_PACEKEEPER_NO_SERVICE: '1'
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/codex-cache" XDG_CONFIG_HOME="$RUNNER_TEMP/codex-config" CODEX_HOME="$RUNNER_TEMP/codex-home"
          out=$(echo '{"hook_event_name":"SessionStart","session_id":"ci-thread","source":"startup","cwd":"'"$PWD"'"}' | bin/pacekeeper-tick)
          echo "$out" | bun -e 'const o=JSON.parse(await Bun.stdin.text()); if (typeof o !== "object" || o === null) process.exit(1)'
          out=$(echo '{"hook_event_name":"UserPromptSubmit","session_id":"ci-thread","prompt":"hi","cwd":"'"$PWD"'"}' | bin/pacekeeper-tick)
          echo "$out" | bun -e 'const o=JSON.parse(await Bun.stdin.text()); if (!String(o.hookSpecificOutput?.additionalContext ?? "").startsWith("[pacekeeper]")) { console.error(o); process.exit(1) }'
          out=$(echo '{"hook_event_name":"Stop","session_id":"ci-thread","stop_hook_active":true,"cwd":"'"$PWD"'"}' | bin/pacekeeper-tick)
          test "$out" = '{}'
          out=$(echo '{"hook_event_name":"PostToolUse","session_id":"ci-thread"}' | bin/pacekeeper-refresh)
          test "$out" = '{}'
          bin/pacekeeper-checkpoint help | grep -q 'resume \[id|lane|N\]'

  # The parity corpus executes the shipped Claude runtime alongside the Codex
  # package, so it needs the Claude package's dependencies installed too.
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: plugins/cc-pacekeeper
      - run: bun install
        working-directory: plugins/codex-pacekeeper
      - run: bun install
        working-directory: tests/parity
      - run: bun test
        working-directory: tests/parity
      - run: bun run typecheck
        working-directory: tests/parity
